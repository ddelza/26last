<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 자동 생성(make-demo.py) — 여기 말고 상위 폴더 원본을 고칠 것 -->
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해결할 문제 정하기</title>
<link rel="stylesheet" href="../common.css?v=8">
<style>
.boss { background: #1b1340; color: #fff; border-radius: 16px; padding: 16px; }
.boss .k { font-size: 0.72rem; letter-spacing: 2px; color: #ffd43b; font-weight: 800; }
.boss .say { font-size: 1.1rem; font-weight: 900; line-height: 1.6; margin-top: 6px; }
.boss .say em { font-style: normal; color: #ffd43b; }
.boss .ev { font-size: 0.85rem; color: #d0bfff; margin-top: 6px; }
.memo { background: #e7f5ff; border-radius: 12px; padding: 10px 12px; font-size: 0.85rem; line-height: 1.6; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem; line-height: 1.55; }
.rules > div { background: #f8f9fa; border-radius: 12px; padding: 10px 12px; }
.rules b { display: block; margin-bottom: 2px; }
@media (max-width: 560px) { .rules { grid-template-columns: 1fr; } }
.cand { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #dee2e6; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; }
.cand.win { border-color: #7048e8; background: #f3f0ff; }
.cand .nm { font-weight: 900; font-size: 1rem; flex: 1; }
.cand .why { display: block; font-weight: 400; font-size: 0.76rem; color: #868e96; }
.cand .v { font-size: 0.8rem; color: #495057; white-space: nowrap; }
.cand button { white-space: nowrap; }
.final { text-align: center; background: #f3f0ff; border-radius: 14px; padding: 12px; }
.final b { display: block; font-size: 1.4rem; color: #5f3dc4; }
</style>
</head>
<body>
<div class="wrap">
  <div id="lab-head"></div>
  <div id="main"><div class="loading-state">불러오는 중...</div></div>
</div>

<script src="../session.js?v=1"></script>
<script src="../lab.js?v=14"></script>
<script src="../demo-seed.js?v=3"></script>
<script src="../hero.js?v=1"></script>
<script>
// ❺ 해결할 문제 정하기 — 선언문(문제+숫자 근거) + HERO 그룹 명(후보 → 투표 → 모둠장 확정)
let R, G, ban, base, me, fP, fE, memo = null;
const E = LAB.esc;

function memoText() { return memo ? `${memo.num || ''}${memo.meaning ? ' → ' + memo.meaning : ''}` : ''; }

function render() {
  document.getElementById('main').innerHTML = LAB.groupBannerHtml(G, ban) + `
  <div class="card">
    <h2>⚔️ 퀘스트 ❺ BOSS · 해결할 문제 정하기</h2>
    <div class="q-do"><span><b>지금 할 일</b> 선언문 쓰기</span><span><b>끝나면</b> 문제 선언문 · HERO 그룹 명</span></div>
    <p class="hint" style="margin:10px 0 0">설문 숫자를 근거로 선언해요. 선언을 마치면 우리 HERO 그룹 이름을 정해요.</p>
  </div>

  <div class="step-h"><div class="n">1</div><h2>선언문 쓰기<span class="sub">모둠이 함께 · 누구나 고칠 수 있어요</span></h2></div>
  <div class="card">
    <div class="memo">📌 ❹에서 고른 숫자: ${memo && memo.num ? `<b>${E(memo.num)}</b>${memo.meaning ? `<br>뜻: ${E(memo.meaning)}` : ''}` : '<span class="dc-muted">아직 없어요 — <a href="s3-result.html">❹ 설문 결과 읽기</a>에서 먼저 적어요.</span>'}</div>
    <div id="fP"></div><div id="fE"></div>
    <div class="boss" id="boss"></div>
  </div>

  <div class="step-h"><div class="n">2</div><h2>우리 HERO 그룹 명 정하기<span class="sub">각자 1개씩 내고 → 투표 → 모둠장이 확정</span></h2></div>
  <div class="card">
    <div class="rules">
      <div><b>✍️ 이렇게 지어요: 궁극의 목적 + 개성</b>① 이 문제가 사라지면 학교는 어떤 모습일까?<br>② 우리 모둠다운 말 하나(좋아하는 것·분위기)<br>③ 합치기: 2~8글자, 소리 내어 읽기 쉽게 (HERO는 붙여도, 안 붙여도 돼요)</div>
      <div><b>🎤 무대 테스트</b>12월 31일 무대에서 사회자가 이 이름을 불러도 우리 모둠이 당당한가요?<br><br><b>💡 예시</b>교실 소음 → 볼륨 조율단 · 급식 → 급식 감사 요정 · 복도 안전 → 안심 길잡이</div>
      <div style="grid-column:1/-1"><b>🙅 이런 이름은 아쉬워요</b>방법만 보이는 이름(쓰레기 줍기단, 소음 줄이기 팀) · 너무 유치하거나 딱딱한 이름 · 친구 이름·별명, 비하하는 말, 특정 사람 겨냥 · 학년·반이 드러나는 이름</div>
    </div>
    <div id="nameFinal" style="margin-top:12px"></div>
    <h3 style="margin:14px 0 6px">후보와 투표</h3>
    <div id="cands"></div>
    <div style="margin-top:10px">
      <label class="field-label" for="myName">내 후보 이름 <span class="dc-muted">(한 사람 1개, 다시 내면 바뀌어요)</span></label>
      <input type="text" id="myName" maxlength="12" placeholder="예) 볼륨 조율단">
      <input type="text" id="myWhy" maxlength="60" placeholder="뜻 한 줄 (예: 서로의 목소리가 들리는 교실 + 음악)" style="margin-top:6px">
      <div class="error-msg" id="nErr"></div>
      <button class="btn small" id="nSave" style="margin-top:8px">💡 후보 내기</button>
    </div>
  </div>`;
  fP = HERO.field(document.getElementById('fP'), { path: `${base}/declare/problem`, label: '우리가 해결할 문제', ph: '예) 쉬는 시간 교실 소리 때문에 친구 말이 안 들리는 문제', rows: 2,
    src: () => G.hasArea ? G.title : '' });
  fE = HERO.field(document.getElementById('fE'), { path: `${base}/declare/evidence`, label: '근거 (숫자로)', rows: 2,
    hint: '"○명 중 ○명(○%)이 [고른 답]을 골랐어요"처럼 써요. 1~6점이나 직접 쓴 문항이면 점수가 많이 몰린 곳, 많이 나온 말을 써요.',
    ph: '예) 126명 중 90명(71%)이 4점 이상, "불편하다"를 골랐어요', src: memoText });
  HERO.onSaved = paintBoss;
  document.getElementById('nSave').onclick = saveName;
}

function paintBoss() {
  const p = HERO.fieldText(fP).trim(), e = HERO.fieldText(fE).trim(), nm = G.heroName;
  document.getElementById('boss').innerHTML = `<div class="k">DECLARATION</div>
    <div class="say">“우리는 <em>${E(p || '[해결할 문제]')}</em>를 해결하겠습니다!”<br>— <em>${E(nm || '[HERO 그룹 명]')}</em></div>
    <div class="ev">근거: ${E(e || '___명 중 ___명(___%)이 [고른 답]을 골랐어요')}</div>`;
}

function paintNames(names, votes, heroName) {
  names = names || {}; votes = votes || {};
  const cnt = {}; Object.values(votes).forEach(v => cnt[v] = (cnt[v] || 0) + 1);
  const ids = Object.keys(names).sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0) || names[a].at - names[b].at);
  const top = ids.length ? cnt[ids[0]] || 0 : 0, myVote = votes[me], canFix = HERO.leaderOk(G);
  document.getElementById('cands').innerHTML = ids.length ? ids.map(id => {
    const n = names[id], who = (G.members.find(m => m.id === id) || {}).name || n.byName || '';
    return `<div class="cand ${top && cnt[id] === top ? 'win' : ''}"><div class="nm">${E(n.name)}<span class="why">${E(n.why || '')} · ${E(who)}</span></div>
      <span class="v">🗳 ${cnt[id] || 0}표</span>
      ${LAB.student.isTeacher ? '' : `<button class="btn small ${myVote === id ? '' : 'ghost'}" data-vote="${id}">${myVote === id ? '✓ 내 표' : '투표'}</button>`}
      ${canFix ? `<button class="btn small secondary" data-fix="${id}">👑 확정</button>` : ''}</div>`;
  }).join('') : '<div class="empty-state" style="padding:10px">아직 후보가 없어요. 각자 하나씩 내 보세요!</div>';
  document.getElementById('nameFinal').innerHTML = heroName && heroName.name
    ? `<div class="final">🦸 우리 HERO 그룹 명<b>${E(heroName.name)}</b><span class="dc-muted" style="font-size:0.75rem">${E(heroName.byName || '')} 확정 · ${LAB.fmtTime(heroName.at)}</span></div>`
    : `<div class="hint">${G.leader ? '투표가 끝나면 <b>👑 모둠장</b>이 확정 버튼을 눌러요.' : '투표가 끝나면 확정 버튼을 눌러요.'}</div>`;
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => { await LAB.put(`${base}/vote/${me}`, b.dataset.vote); refreshNames(); });
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => {
    const n = names[b.dataset.fix]; if (!confirm(`"${n.name}"(으)로 우리 HERO 그룹 명을 확정할까요?\n무대 테스트를 통과했는지 한 번 더 생각해 봐요!`)) return;
    const H0 = HERO.me(); await LAB.put(`${base}/heroName`, { name: n.name, why: n.why || '', by: H0.id, byName: H0.name, at: LAB.TS });
    G.heroName = n.name; refreshNames(); paintBoss();
  });
}
async function refreshNames() {
  const [names, votes, hn] = await Promise.all([LAB.get(`${base}/names`), LAB.get(`${base}/vote`), LAB.get(`${base}/heroName`)]);
  if (hn && hn.name !== G.heroName) { G.heroName = hn.name; paintBoss(); }
  paintNames(names, votes, hn);
}
async function saveName() {
  const n = document.getElementById('myName').value.trim(), w = document.getElementById('myWhy').value.trim(), err = document.getElementById('nErr');
  err.classList.remove('show');
  if (LAB.student.isTeacher) { err.textContent = '교사 보기에서는 후보를 내지 않아요.'; return err.classList.add('show'); }
  if (n.length < 2 || n.length > 12) { err.textContent = '이름은 2~8글자 정도로 써 주세요.'; return err.classList.add('show'); }
  if (/[1-3]\s*학년|\d\s*반/.test(n)) { err.textContent = '학년·반이 드러나는 이름은 쓰지 않아요.'; return err.classList.add('show'); }
  await LAB.put(`${base}/names/${me}`, { name: n, why: w, byName: LAB.student.name, at: LAB.TS });
  document.getElementById('myName').value = ''; document.getElementById('myWhy').value = '';
  refreshNames();
}

HERO.boot({ heroStage: 2, title: '해결할 문제 정하기', subtitle: '설문 숫자를 근거로 "우리는 이 문제를 해결하겠습니다!"라고 선언해요.' }).then(async r => {
  R = r; ban = r.ban; G = r.group; base = r.base; me = LAB.student.id;
  if (LAB.student.isTeacher) document.getElementById('lab-head').insertAdjacentHTML('beforeend', LAB.teacherPickerHtml(ban, r.data, G));
  if (!LAB.isHero(ban)) { document.getElementById('main').innerHTML = '<div class="card center">이 화면은 1·2학년 광수 HERO용이에요.</div>'; return; }
  if (!G) { document.getElementById('main').innerHTML = LAB.noGroupHtml(); return; }
  memo = await LAB.get(`${base}/memo`);
  render();
  await HERO.refreshFields(); paintBoss(); refreshNames();
  document.querySelectorAll('.hf textarea').forEach(t => t.addEventListener('input', paintBoss));
  HERO.poll(() => { HERO.refreshFields().then(paintBoss); refreshNames(); });
});
</script>
</body>
</html>
