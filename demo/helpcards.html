<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 자동 생성(make-demo.py) — 여기 말고 상위 폴더 원본을 고칠 것 -->
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 도움카드</title>
<link rel="stylesheet" href="../common.css?v=7">
<style>
:root { --stage: #7048e8; --stage-soft: #f3f0ff; }
.back { display: inline-block; margin-bottom: 10px; font-size: 0.84rem; color: var(--text-muted); text-decoration: none; }
.intro { font-size: 0.9rem; line-height: 1.75; }
.intro b { color: var(--stage); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.filters .lab { width: 100%; font-size: 0.78rem; font-weight: 800; color: #495057; margin-top: 4px; }
.filters button { border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
.filters button.on { background: var(--stage); border-color: var(--stage); color: #fff; font-weight: 800; }
.hc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; }
.hc { background: #fff; border-radius: 16px; border: 1.5px solid #e9ecef; border-top: 6px solid var(--stage); padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.hc.mine { border-color: var(--stage); }
.hc .nm { font-size: 1.08rem; font-weight: 900; }
.hc .nm small { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
.hc .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.hc .tag { font-size: 0.72rem; font-weight: 800; border-radius: 6px; padding: 2px 8px; background: var(--stage-soft); color: var(--stage); }
.hc .tag.g { background: #e6fcf5; color: #087f5b; }
.hc ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.88rem; line-height: 1.65; }
.hc .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 8px; }
.search { display: flex; align-items: center; gap: 6px; border: 2px solid var(--stage); border-radius: 12px; padding: 4px 6px 4px 12px; background: #fff; }
.search input { flex: 1; border: none; outline: none; font-size: 0.95rem; padding: 8px 0; font-family: inherit; background: none; min-width: 0; }
.search button { border: none; background: #f1f3f5; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: #868e96; }
.filters.quick button { border-style: dashed; }
.result-bar { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; font-size: 0.84rem; color: #495057; }
.result-bar b { color: var(--stage); }
.result-bar button { border: none; background: none; color: var(--text-muted); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 0.8rem; }
.hc mark { background: #ffec99; color: inherit; border-radius: 3px; padding: 0 1px; }
.edit-box .checks { display: flex; flex-wrap: wrap; gap: 6px; }
.g-btn { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #dadce0; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
.g-btn:disabled { opacity: .6; }
.who-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; font-weight: 700; background: var(--stage-soft); color: var(--stage); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
.who-line button { background: none; border: none; color: var(--stage); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <div id="lab-head"></div>
  <a class="back" href="javascript:history.length > 1 ? history.back() : (location.href='index.html')">← 하던 곳으로 돌아가기</a>

  <div class="card intro">
    🙋 <b>교사 도움카드</b>는 광수중 선생님들이 <b>"이런 건 내가 도와줄 수 있어요!"</b> 하고 적어 둔 카드예요.<br>
    프로젝트를 하다가 막히면 우리 학년·과목에 맞는 선생님 카드를 찾아보고, <b>직접 찾아가서 도움을 요청</b>해 봐요.
    <div class="tip" style="margin-top:10px">💬 찾아갈 때는 <b>"○모둠인데요, ○○ 문제를 하고 있어요. △△이 궁금해요"</b>처럼 무엇을 도와 달라는지 미리 정리해 가면 좋아요.</div>
  </div>

  <div class="card">
    <div class="search"><span>🔍</span><input type="search" id="q" placeholder="무엇이 필요해요? 예) 설문 정리, 그래프, 발표, AI, 선생님 이름" autocomplete="off"><button id="qClear" title="지우기">✕</button></div>
    <div class="filters" id="fQuick"></div>
    <div class="filters" id="fGrade"></div>
    <div class="filters" id="fSubj"></div>
  </div>
  <div class="result-bar"><span id="count"></span><button id="reset">↺ 조건 모두 지우기</button></div>
  <div id="cards"><div class="loading-state">불러오는 중...</div></div>

  <div class="card edit-box" id="editCard" style="margin-top:16px">
    <h2>✏️ 선생님, 도움카드를 써 주세요</h2>
    <div id="editBody"></div>
  </div>
</div>

<script src="../session.js?v=1"></script>
<script src="../lab.js?v=12"></script>
<script src="../demo-seed.js?v=2"></script>
<script src="../help-teachers.js?v=1"></script>
<script>
const SUBJECTS = ['국어', '영어', '수학', '사회', '역사', '도덕', '과학', '기술·가정', '정보', '체육', '음악', '미술', '한문', '진로', '특수', '보건', '영양', '상담', '도서관', '그 밖의 것'];
const GRADES = ['1', '2', '3'];
const E = LAB.esc;
let cards = {}, fGrade = '', fSubj = '', fq = '', meKey = null, meInfo = null;
// 학생들이 자주 찾을 만한 도움 — 누르면 검색창에 들어가요
const QUICK = ['설문 정리', '그래프', '과학적 근거', 'AI', '발표', '포스터', '토론', '인터뷰', '글쓰기', '디자인'];

const sha = async s => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s.trim().toLowerCase())))).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 20);

function chips(el, list, cur, label, onPick) {
  el.innerHTML = `<div class="lab">${label}</div>` + [['', '전체']].concat(list.map(x => [x, x])).map(([v, t]) =>
    `<button data-v="${E(v)}" class="${cur === v ? 'on' : ''}">${E(t)}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => onPick(b.dataset.v));
}
function renderFilters() {
  chips(document.getElementById('fQuick'), QUICK, fq, '💡 자주 찾는 도움', v => { setQ(v === fq ? '' : v); });
  document.getElementById('fQuick').classList.add('quick');
  document.querySelector('#fQuick button[data-v=""]').remove();
  chips(document.getElementById('fGrade'), GRADES.map(g => g + '학년'), fGrade && fGrade + '학년', '🎒 도움 받을 학년', v => { fGrade = v.replace('학년', ''); renderAll(); });
  const used = SUBJECTS.filter(s => Object.values(cards).some(c => (c.subjects || []).includes(s)));
  chips(document.getElementById('fSubj'), used, fSubj, '📚 과목', v => { fSubj = v; renderAll(); });
}
// 검색어(띄어쓰기로 나눈 낱말 모두 포함) — 이름·과목·도움 내용에서 찾음
const words = () => fq.trim().toLowerCase().split(/\s+/).filter(Boolean);
const hay = c => [c.name, c.role, (c.subjects || []).join(' '), (c.grades || []).map(g => g + '학년').join(' '), (c.items || []).join(' ')].join(' ').toLowerCase().replace(/\s+/g, '');
const hit = c => { const h = hay(c); return words().every(w => h.includes(w)); };
function hl(t) {
  t = String(t || ''); const ws = words(); if (!ws.length) return E(t);
  const low = t.toLowerCase(), on = new Array(t.length).fill(false);
  ws.forEach(w => { for (let i = low.indexOf(w); i >= 0; i = low.indexOf(w, i + 1)) for (let j = i; j < i + w.length; j++) on[j] = true; });
  let out = '', open = false;
  for (let i = 0; i < t.length; i++) {
    if (on[i] !== open) { out += on[i] ? '<mark>' : '</mark>'; open = on[i]; }
    out += E(t[i]);
  }
  return out + (open ? '</mark>' : '');
}
function setQ(v) { fq = v; document.getElementById('q').value = v; renderAll(); }
function cardHtml(k, c) {
  return `<div class="hc${k === meKey ? ' mine' : ''}"><div class="nm">${hl(c.name)} 선생님<small>${hl(c.role || '')}</small></div>
    <div class="tags">${(c.subjects || []).map(s => `<span class="tag">${hl(s)}</span>`).join('')}${(c.grades || []).map(g => `<span class="tag g">${g}학년</span>`).join('')}</div>
    <div style="font-size:0.78rem;font-weight:800;color:#495057">🙌 이런 걸 도와줄 수 있어요</div>
    <ul>${(c.items || []).map(t => `<li>${hl(t)}</li>`).join('')}</ul>
    <div class="meta">${c.updatedAt ? LAB.fmtTime(c.updatedAt) + ' 고침' : ''}</div></div>`;
}
function renderAll() { renderFilters(); renderCards(); }
function renderCards() {
  const ks = Object.keys(cards).filter(k => {
    const c = cards[k];
    return (!fGrade || (c.grades || []).includes(fGrade)) && (!fSubj || (c.subjects || []).includes(fSubj)) && hit(c);
  }).sort((a, b) => (cards[a].name || '').localeCompare(cards[b].name || '', 'ko'));
  document.getElementById('cards').innerHTML = ks.length ? `<div class="hc-grid">${ks.map(k => cardHtml(k, cards[k])).join('')}</div>`
    : `<div class="empty-state">${Object.keys(cards).length ? '조건에 맞는 카드가 없어요. 검색어를 바꾸거나 "조건 모두 지우기"를 눌러 보세요.' : '아직 등록된 도움카드가 없어요.'}</div>`;
  const on = fq.trim() || fGrade || fSubj;
  document.getElementById('count').innerHTML = `도움카드 <b>${ks.length}</b>장${on ? ` <span class="dc-muted">/ 전체 ${Object.keys(cards).length}장</span>` : ''}`;
  document.getElementById('reset').style.visibility = on ? 'visible' : 'hidden';
}
// 검색창: 카드 목록만 다시 그려서 한글 입력이 끊기지 않게
document.getElementById('q').addEventListener('input', e => { fq = e.target.value; renderCards();
  document.querySelectorAll('#fQuick button').forEach(b => b.classList.toggle('on', b.dataset.v === fq)); });
document.getElementById('qClear').onclick = () => setQ('');
document.getElementById('reset').onclick = () => { fGrade = ''; fSubj = ''; setQ(''); };
async function loadCards() { cards = (await LAB.get('helpcards')) || {}; renderAll(); }

// ---------- 선생님 편집 ----------
function loginView(msg) {
  document.getElementById('editBody').innerHTML = `
    <p class="hint">도움카드는 <b>광수중 교사 구글 계정</b>으로 로그인해야 쓰고 고칠 수 있어요. 학생은 보기만 할 수 있어요.</p>
    <button class="g-btn" id="gBtn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.2-13.4-9.9l-8 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span id="gLabel">교사 구글 계정으로 로그인</span></button>
    <div class="error-msg ${msg ? 'show' : ''}" id="gErr">${E(msg || '')}</div>`;
  document.getElementById('gBtn').onclick = () => window.googleLogin && window.googleLogin();
}
function editView() {
  const c = cards[meKey] || {}, subs = c.subjects || (meInfo.sub && SUBJECTS.includes(meInfo.sub) ? [meInfo.sub] : []), grs = c.grades || [];
  document.getElementById('editBody').innerHTML = `
    <div class="who-line"><span>✓ ${E(meInfo.name)} 선생님${LAB.DEMO ? ' (체험판)' : ''}</span>${LAB.DEMO || meInfo.viaSession ? '' : '<button id="gOut">로그아웃</button>'}</div>
    <label class="field-label">과목 <span class="dc-muted">(여러 개 골라도 돼요)</span></label>
    <div class="checks">${SUBJECTS.map(s => `<label class="chip"><input type="checkbox" name="sub" value="${s}" ${subs.includes(s) ? 'checked' : ''}><span>${s}</span></label>`).join('')}</div>
    <label class="field-label">도움 줄 학년</label>
    <div class="checks">${GRADES.map(g => `<label class="chip"><input type="checkbox" name="gr" value="${g}" ${grs.includes(g) ? 'checked' : ''}><span>${g}학년</span></label>`).join('')}</div>
    <label class="field-label" for="items">도움 줄 수 있는 것 <span class="dc-muted">(한 줄에 하나씩 — 줄마다 한 항목이 돼요)</span></label>
    <textarea id="items" rows="6" placeholder="예) 문제를 해결하는 데 필요한 과학적 근거 검증 및 보충&#10;예) 설문 결과 그래프 만들기">${E((c.items || []).join('\n'))}</textarea>
    <div class="error-msg" id="eErr"></div><div class="ok-msg" id="eOk"></div>
    <div class="btn-row">${cards[meKey] ? '<button class="btn ghost" id="eDel">카드 내리기</button>' : ''}<button class="btn" id="eSave" style="background:var(--stage)">💾 내 도움카드 저장</button></div>`;
  const o = document.getElementById('gOut'); if (o) o.onclick = () => window.googleLogout();
  document.getElementById('eSave').onclick = saveMine;
  const d = document.getElementById('eDel'); if (d) d.onclick = async () => {
    if (!confirm('내 도움카드를 내릴까요? 학생들에게 더 이상 보이지 않아요.')) return;
    await LAB.del(`helpcards/${meKey}`); delete cards[meKey]; renderAll(); editView();
  };
}
async function saveMine() {
  const err = document.getElementById('eErr'), ok = document.getElementById('eOk'); err.classList.remove('show'); ok.classList.remove('show');
  const subjects = [...document.querySelectorAll('input[name=sub]:checked')].map(x => x.value);
  const grades = [...document.querySelectorAll('input[name=gr]:checked')].map(x => x.value);
  const items = document.getElementById('items').value.split('\n').map(s => s.replace(/^\s*[-*·•]\s*/, '').trim()).filter(Boolean);
  const miss = [!subjects.length && '과목', !grades.length && '학년', !items.length && '도움 줄 수 있는 것'].filter(Boolean);
  if (miss.length) { err.textContent = '아직 비어 있어요: ' + miss.join(', '); err.classList.add('show'); return; }
  const rec = { name: meInfo.name, role: meInfo.sub || '', subjects, grades, items, updatedAt: Date.now() };
  try { await LAB.put(`helpcards/${meKey}`, rec); cards[meKey] = rec; renderAll(); editView();
    const o = document.getElementById('eOk'); o.textContent = '저장했어요! 위 카드 목록에 바로 보여요.'; o.classList.add('show');
  } catch (e) { err.textContent = '저장하지 못했어요. 다시 눌러 주세요.'; err.classList.add('show'); }
}
// 구글 로그인 결과 → 교사 명단 대조
window.afterGoogleLogin = async function (email) {
  let h = await sha(email); h = (window.HELP_ALIAS || {})[h] || h;
  const t = (window.HELP_TEACHERS || {})[h];
  if (!t) { loginView(`${email} 은(는) 광수중 교사 계정 명단에 없어요. 학교 교사 계정(@gwangsu.ms.kr)으로 다시 로그인해 주세요.`); return false; }
  meKey = h; meInfo = { name: t[0], sub: t[1] }; renderAll(); editView(); return true;
};

LAB.start({ needLogin: false, title: '교사 도움카드', subtitle: '막히면 찾아가요 — 선생님들이 도와줄 수 있는 것' }).then(async () => {
  LAB.student = getSrStudent();
  if (LAB.student && !LAB.student.isTeacher && LAB.student.grade) fGrade = String(LAB.student.grade);
  await loadCards();
  if (LAB.DEMO) {
    // 체험판: 구글 로그인 없이 "체험 선생님" 카드로 써 볼 수 있게
    let k = null; try { k = localStorage.getItem('last26DemoHelpKey'); } catch (e) {}
    if (!k) { k = 'demo' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('last26DemoHelpKey', k); } catch (e) {} }
    const s = getSrStudent();
    meKey = k; meInfo = { name: (s && s.isTeacher && s.name) || '체험', sub: '' };
    document.querySelector('#editCard h2').insertAdjacentHTML('afterend', '<p class="hint">🧪 체험판에서는 구글 로그인 없이 써 볼 수 있어요. (실제 사이트에서는 교사 구글 계정 로그인이 필요해요)</p>');
    editView();
  } else {
    // 첫 화면에서 교사로 들어왔으면(교사 구글 계정 또는 3000 계정) 다시 로그인하지 않아도 됨
    const s = getSrStudent(), t = s && s.isTeacher && s.gkey && (window.HELP_TEACHERS || {})[s.gkey];
    if (t && !meKey) { meKey = s.gkey; meInfo = { name: t[0], sub: t[1], viaSession: true }; renderAll(); editView(); }
    else if (!meKey) loginView('');
  }
});
</script>
<!-- gwangsu-on Firebase Google 로그인 (26-2status·sr-exhibition과 같은 설정) -->
<script type="module">
  if (!window.LAB || !LAB.DEMO) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const app = initializeApp({
      apiKey: "AIzaSyB_D2Wi944YQL-1rCdgeNU-tD8lpMek_wM",
      authDomain: "gwangsu-on.firebaseapp.com",
      databaseURL: "https://gwangsu-on-default-rtdb.firebaseio.com",
      projectId: "gwangsu-on",
      storageBucket: "gwangsu-on.firebasestorage.app",
      messagingSenderId: "684885628658",
      appId: "1:684885628658:web:b471726b604754a82b626b",
    }, 'helpcards');
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    window.googleLogin = async () => {
      const b = document.getElementById('gBtn'), l = document.getElementById('gLabel');
      if (b) b.disabled = true; if (l) l.textContent = '로그인 중...';
      try { await signInWithPopup(auth, provider); }
      catch (err) {
        const c = err && err.code;
        if (c === "auth/popup-blocked" || c === "auth/cancelled-popup-request" || c === "auth/operation-not-supported-in-this-environment") { try { await signInWithRedirect(auth, provider); return; } catch (e2) {} }
        if (b) b.disabled = false; if (l) l.textContent = '교사 구글 계정으로 로그인';
      }
    };
    window.googleLogout = async () => { await signOut(auth); location.reload(); };
    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, async user => {
      if (!user) return;
      const wait = () => new Promise(r => { const t = setInterval(() => { if (document.getElementById('editBody').innerHTML || window.__cardsReady) { clearInterval(t); r(); } }, 100); });
      await wait();
      const ok = await window.afterGoogleLogin(String(user.email || '').toLowerCase());
      if (!ok) await signOut(auth);
    });
  }
</script>
</body>
</html>
